{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    <section class="bedankt-pagina container">
        <div class="bedankt-pagina__inhoud">
            <div class="bedankt-pagina__icoon" aria-hidden="true">✓</div>
            <h1 class="bedankt-pagina__titel">Bericht ontvangen</h1>
            {% if page.bedankt_tekst %}
                <div class="bedankt-pagina__tekst richtext">{{ page.bedankt_tekst|richtext }}</div>
            {% else %}
                <p class="bedankt-pagina__tekst">Bedankt voor je bericht! We nemen zo snel mogelijk contact met je op.</p>
            {% endif %}
            <a href="/" class="knop knop--primair">Terug naar de startpagina</a>
        </div>
    </section>
{% endblock %}
